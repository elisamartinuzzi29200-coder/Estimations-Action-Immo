<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#128b84">
  <title>Action Immobilière — Estimations partagées</title>
  <link rel="stylesheet" href="cloud-app.css?v=1">
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-card">
      <div class="spinner" aria-hidden="true"></div>
      <strong>Ouverture de l’espace Action Immobilière…</strong>
    </div>
  </div>

  <section id="login-gate" class="login-gate hidden" aria-labelledby="login-title">
    <div class="login-card">
      <img class="brand-logo" src="ACTION%20IMMO_LOGO%20RVB.png" alt="Action Immobilière">
      <h1 id="login-title">Espace estimations</h1>
      <p class="subtitle">Connectez-vous pour retrouver et modifier les mêmes dossiers sur tablette et ordinateur.</p>
      <form id="login-form">
        <label class="field">Adresse e-mail
          <input id="login-email" name="email" type="email" autocomplete="username" required maxlength="254" placeholder="prenom@action-immo.com">
        </label>
        <label class="field">Mot de passe
          <input id="login-password" name="password" type="password" autocomplete="current-password" required minlength="8">
        </label>
        <button class="primary" type="submit">Se connecter</button>
        <p id="login-message" class="login-message" aria-live="polite"></p>
      </form>
      <div class="login-help">
        <a class="link-button" href="connexion.html">Activer mon accès ou changer mon mot de passe</a>
      </div>
      <div class="login-help">
        <a class="link-button" href="estimation-local.html">Ouvrir exceptionnellement le mode local</a>
      </div>
    </div>
  </section>

  <div id="app-shell" class="app-shell hidden">
    <header class="cloud-bar">
      <div class="cloud-brand">
        <img src="ACTION%20IMMO_LOGO%20RVB.png" alt="Action Immobilière">
        <div><strong>Estimations partagées</strong><small>Brest · Quimper</small></div>
      </div>
      <div id="cloud-status" class="cloud-status">Connexion…</div>
      <div id="user-email" class="user-chip"></div>
      <div class="cloud-actions">
        <button id="cloud-refresh" class="secondary" type="button"><span class="label">Actualiser</span> ↻</button>
        <button id="cloud-logout" class="secondary" type="button"><span class="label">Se déconnecter</span> ⎋</button>
      </div>
    </header>
    <div class="frame-wrap">
      <div id="migration-banner" class="migration-banner hidden">
        <p id="migration-text"></p>
        <button id="migrate-local" class="primary" type="button">Importer dans l’espace partagé</button>
        <button id="dismiss-migration" class="secondary" type="button">Plus tard</button>
      </div>
      <iframe id="app-frame" class="app-frame" title="Formulaire d’estimation Action Immobilière"></iframe>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p>JavaScript doit être activé pour utiliser l’application.</p></noscript>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="cloud-app.js?v=1"></script>
</body>
</html>
